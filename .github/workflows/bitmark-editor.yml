# CI for @gmb/bitmark-editor and @gmb/bitmark-editor-angular (PLAN-023 Step 16).
# No publishing from this repo: the packages are published once they have
# their own repository (PLAN-022 D6). Their package.json files are ready for it.
name: bitmark-editor

on:
  push:
    branches: ["main"]
    paths:
      - "packages/bitmark-editor/**"
      - "packages/bitmark-editor-angular/**"
      - "src/**"
      - ".github/workflows/bitmark-editor.yml"
  pull_request:
    paths:
      - "packages/bitmark-editor/**"
      - "packages/bitmark-editor-angular/**"
      - "src/**"
      - ".github/workflows/bitmark-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bitmark-editor
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Install (workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: The playground still compiles and passes on the package source
        working-directory: .
        run: |
          npx tsc --noEmit
          bun run test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Examples (static site on Monaco 0.57, /esm consumer)
        working-directory: packages/bitmark-editor/examples
        run: |
          bun install
          npx playwright install --with-deps chromium
          bun run test
      - uses: actions/upload-artifact@v4
        with:
          name: bitmark-editor-dist
          path: packages/bitmark-editor/dist

  angular:
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bitmark-editor-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@v4
        with:
          name: bitmark-editor-dist
          path: packages/bitmark-editor/dist
      - run: npm ci
      - run: npx ng build bitmark-editor-angular
      - run: npx ng build example
      - name: "Example (cosmic-shaped: zones, Monaco 0.46 AMD, injected parser)"
        working-directory: packages/bitmark-editor-angular/e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bitmark-editor-angular-dist
          path: packages/bitmark-editor-angular/dist/bitmark-editor-angular
