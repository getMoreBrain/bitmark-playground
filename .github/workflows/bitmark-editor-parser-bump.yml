# The pinned default parser version (PLAN-020 D13): weekly, open a PR that
# bumps it to the latest @gmb/bitmark-parser. The PR runs the full
# bitmark-editor CI; merging it makes the next patch release.
name: bitmark-editor parser bump

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - id: bump
        working-directory: packages/bitmark-editor
        run: echo "version=$(node scripts/bump-parser.mjs)" >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.version != ''
        run: bun install
      - if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bitmark-editor/parser-${{ steps.bump.outputs.version }}
          title: "chore(bitmark-editor): default parser ${{ steps.bump.outputs.version }}"
          commit-message: "chore(bitmark-editor): default parser ${{ steps.bump.outputs.version }}"
          body: |
            Bumps the pinned default parser version (PLAN-020 D13) to `${{ steps.bump.outputs.version }}`.
            The bitmark-editor CI runs the full unit and browser suite against it.
